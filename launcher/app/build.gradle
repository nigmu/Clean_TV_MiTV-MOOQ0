plugins {
    id 'com.android.application'
}

def unsplashAccessKey = ""
def envFile = new File(rootProject.projectDir.parentFile, ".env")
if (envFile.isFile()) {
    envFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith("#") || !line.contains("=")) return
        int eq = line.indexOf("=")
        def name = line.substring(0, eq).trim()
        def value = line.substring(eq + 1).trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"'))
                || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        if ("UNSPLASH_ACCESS_KEY" == name) unsplashAccessKey = value
        else if ("unsplash_api_key" == name && unsplashAccessKey.isEmpty()) unsplashAccessKey = value
    }
}
def escapedUnsplashKey = unsplashAccessKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName 'v2'
        // Baked from the repo-root .env at build time. Empty when the key is missing: Home still opens.
        buildConfigField "String", "UNSPLASH_ACCESS_KEY", '"' + escapedUnsplashKey + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
